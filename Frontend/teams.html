<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BLMS - Teams</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <div class="header-bar">
                <div class="site-title">KBF- Premier League</div>
                <nav>
                    <ul>
                        <li><a href="home.html">Home</a></li>
                        <li><a href="teams.html">Teams</a></li>
                        <li><a href="players.html">Players</a></li>
                        <li><a href="injury.html">Injury</a></li>
                        <li><a href="stats.html">Stats</a></li>
                        <li><a href="fixtures.html">Fixtures</a></li>
                    </ul>
                </nav>
                <a class="login-button" href="auth.html">Sign In</a>
            </div>
        </header>

        <div class="main-container">
            <main>
                <h1>League Teams</h1>
                <p>Browse league teams with associated managers, club information, and roster links.</p>

                <div id="teams-status" class="status-message">Loading teams...</div>

                <div class="table-wrapper">
                    <table class="data-table" id="teams-table">
                        <thead>
                        <tr>
                            <th>Logo</th>
                            <th>Team Name</th>
                            <th>Manager</th>
                            <th>Manager Photo</th>
                            <th>History</th>
                        </tr>
                        </thead>
                        <tbody id="teams-body"></tbody>
                    </table>
                </div>
            </main>

            <div class="footer">
                &copy; 2026 Basketball League Management System
            </div>
        </div>

        <script>
            const API_BASE = "";

            function apiUrl(path) {
                return API_BASE + path;
            }

            // Photos and logos are OCI Object Storage URLs — use directly as src.
            function imgTag(url, alt, cssClass) {
                if (!url) return "N/A";
                return '<img class="' + cssClass + '" src="' + url + '" alt="' + alt + '">';
            }

            function managerLabel(manager) {
                if (!manager) return "N/A";
                const middle = manager.middleName ? " " + manager.middleName : "";
                return manager.firstName + middle + " " + manager.lastName;
            }

            async function loadTeams() {
                const status = document.getElementById("teams-status");
                const body = document.getElementById("teams-body");

                try {
                    const [teamsResponse, managersResponse] = await Promise.all([
                        fetch(apiUrl("/api/teams")),
                        fetch(apiUrl("/api/managers"))
                    ]);

                    if (!teamsResponse.ok || !managersResponse.ok) {
                        throw new Error("Unable to fetch teams or managers data.");
                    }

                    const teams = await teamsResponse.json();
                    const managers = await managersResponse.json();

                    // Index managers by their ID for O(1) lookup.
                    const managerByID = new Map();
                    managers.forEach((m) => managerByID.set(m.managerId, m));

                    body.innerHTML = "";
                    teams.forEach((team) => {
                        // clubManagerId is *int64 (omitempty) — may be absent when NULL.
                        const managerID = team.clubManagerId ?? null;
                        const manager = managerID !== null ? managerByID.get(managerID) : null;

                        const managerCell = managerID !== null
                            ? `<a href="manager.html?id=${managerID}">${managerLabel(manager)}</a>`
                            : "N/A";

                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${imgTag(team.teamLogo, "Team Logo", "thumb-img")}</td>
                            <td><a class="team-link" href="team.html?id=${team.clubId}">${team.teamName}</a></td>
                            <td>${managerCell}</td>
                            <td>${imgTag(team.clubManagerPhoto, "Manager Photo", "thumb-img")}</td>
                            <td>${team.clubHistory || "N/A"}</td>
                        `;
                        body.appendChild(row);
                    });

                    status.textContent = "Teams loaded: " + teams.length;
                    status.className = "status-message status-success";
                } catch (error) {
                    status.textContent = "Failed to load teams: " + error.message;
                    status.className = "status-message status-error";
                }
            }

            loadTeams();
        </script>
    </body>
</html>
