<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BLMS - Admin Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <div class="header-bar">
                <div class="site-title">Basketball League Management System - Admin</div>
            </div>
        </header>

        <main class="main-container">
            <h1>Admin Login</h1>
            <p>Sign in to manage league data and system updates.</p>

            <section class="card-section">
                <h2>Administrator Access</h2>
                <p class="section-note">Use the same form to sign in, recover a forgotten password, or create a new admin account.</p>
                <form id="adminLoginForm" class="data-form">
                    <label>
                        Username
                        <input id="adminUsername" name="username" type="text" autocomplete="username" required>
                    </label>
                    <label>
                        Password
                        <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <label id="adminConfirmPasswordGroup" hidden>
                        Confirm New Password
                        <input id="adminConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
                    </label>
                    <div class="button-group">
                        <button type="submit" id="adminLoginButton">Sign in</button>
                        <button type="button" id="adminCreatePasswordButton">Create or reset admin account</button>
                        <button type="button" id="adminCancelCreatePasswordButton" hidden>Back to sign in</button>
                    </div>
                </form>
                <div class="status-message" id="adminLoginMessage" aria-live="polite"></div>
            </section>
        </main>

        <script>
            const API_BASE = "";

            function apiUrl(path) {
                return API_BASE + path;
            }

            function setMessage(node, message, kind) {
                node.textContent = message || "";
                node.className = "status-message" + (kind ? " status-" + kind : "");
            }

            function setBusy(button, busy, label) {
                button.disabled = busy;
                button.textContent = busy ? "Please wait..." : label;
            }

            let createPasswordMode = false;

            function setCreatePasswordMode(enabled) {
                createPasswordMode = enabled;
                const confirmGroup = document.getElementById("adminConfirmPasswordGroup");
                const confirmInput = document.getElementById("adminConfirmPassword");
                const submitButton = document.getElementById("adminLoginButton");
                const createButton = document.getElementById("adminCreatePasswordButton");
                const cancelButton = document.getElementById("adminCancelCreatePasswordButton");

                confirmGroup.hidden = !enabled;
                confirmInput.required = enabled;
                confirmInput.value = "";
                submitButton.textContent = enabled ? "Save admin account" : "Sign in";
                createButton.hidden = enabled;
                cancelButton.hidden = !enabled;
            }

            document.getElementById("adminCreatePasswordButton").addEventListener("click", () => {
                setMessage(document.getElementById("adminLoginMessage"), "", "");
                setCreatePasswordMode(true);
            });

            document.getElementById("adminCancelCreatePasswordButton").addEventListener("click", () => {
                setMessage(document.getElementById("adminLoginMessage"), "", "");
                setCreatePasswordMode(false);
            });

            document.getElementById("adminLoginForm").addEventListener("submit", async (event) => {
                event.preventDefault();
                const message = document.getElementById("adminLoginMessage");
                const button = document.getElementById("adminLoginButton");
                const confirmPassword = document.getElementById("adminConfirmPassword");
                const submitLabel = createPasswordMode ? "Save admin account" : "Sign in";

                setMessage(message, "", "");
                setBusy(button, true, submitLabel);

                const payload = {
                    username: document.getElementById("adminUsername").value.trim(),
                    password: document.getElementById("adminPassword").value,
                    createPassword: createPasswordMode,
                    confirmPassword: createPasswordMode ? confirmPassword.value : ""
                };

                try {
                    const response = await fetch(apiUrl("/api/admin/login"), {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "Admin login failed");
                    }
                    window.location.href = "admin.html";
                } catch (error) {
                    setMessage(message, error.message, "error");
                } finally {
                    setBusy(button, false, submitLabel);
                }
            });
        </script>
    </body>
</html>
